checks: {}
commit:
  compatibility: {}
  compatibilityPrompt: {}
  functionalityRemovedPrompt: {}
  groupingPrompt: {}
  hooks:
  - name: vendor-icon-sources
    run: |
      set -e
      pnpm --filter @flanksource/clicky-ui download:icons
      git add packages/ui/icons/svg
    files:
    - .gitignore
    - packages/ui/icons/icon-selections.json
    - packages/ui/icons/svg/**/*.svg
    - packages/ui/package.json
    - packages/ui/scripts/build-icons.ts
    - packages/ui/scripts/download-icons.ts
    - packages/ui/scripts/icon-sources.ts
  linkedDeps: {}
  lint: {}
  messagePrompt: {}
  prContentPrompt: {}
  precommit: {}
  summaryPrompt: {}
  tidy: {}
fixtures: {}
lint:
  ignore:
  - file: pnpm-lock.yaml
    rule: omar-country-short-codes
    source: betterleaks
  - file: .gavel.yaml
    rule: omar-brand-names
    source: betterleaks
pre:
- name: build
  run: pnpm --filter @flanksource/clicky-ui run build
- name: install-storybook-browser
  run: pnpm --filter storybook exec playwright install chromium
procfile: {}
secrets: {}
ssh: {}
status:
  summaryPrompt: {}
test:
  outlineSummaryPrompt: {}
todos:
  planPrompt: {}
  runPrompt: {}
verify:
  checks:
    disabled: null
    disabledCategories: null
  model: ""
  prompt: ""
  promptTemplate: {}
