packages:
  - packages/*
  - apps/*
  - e2e
# Link every package through the global virtual store. Sibling workspaces (e.g.
# gavel/testrunner/ui) include packages/ui as a workspace project, so a shared
# store keeps their installs from repointing packages/ui/node_modules.
enableGlobalVirtualStore: true
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  vue-demi: true

catalog:
  "@ai-sdk/react": ^3.0.201
  # @flanksource/react-grab (the react-grab source fork) builds with these, on upstream react-grab@0.1.50's ranges.
  "@babel/core": ^7.29.0
  "@babel/preset-typescript": ^7.28.5
  "@chromatic-com/storybook": ^5.6.0
  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/commands": ^6.10.4
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lang-sql": ^6.10.0
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.0
  "@codemirror/view": ^6.43.4
  "@flanksource/facet": 0.1.74
  "@flanksource/icons": 1.0.65
  "@floating-ui/react": ^0.27.19
  # @flanksource/icons/icon imports this but leaves it external and undeclared,
  # so every consumer has to install it. Pinned to what the trust repo runs
  # against the same icons version.
  "@iconify/react": 6.0.2
  # Build-time only: the icon codegen renders icon-data API responses to SVG.
  "@iconify/types": ^2.0.0
  "@iconify/utils": ^3.1.3
  # page-runtime's compiler: the MDX compiler and the remark/rehype plugins facet's build runs, on facet's ranges.
  "@mdx-js/mdx": ^3.1.1
  "@mdxeditor/editor": ^4.0.4
  "@monaco-editor/react": ^4.7.0
  "@oxlint/plugins": ^1.60.0
  "@playwright/test": ^1.49.1
  "@radix-ui/react-accordion": ^1.2.2
  "@radix-ui/react-avatar": ^1.1.2
  "@radix-ui/react-collapsible": ^1.1.2
  "@radix-ui/react-compose-refs": ^1.1.2
  "@radix-ui/react-dialog": ^1.1.4
  "@radix-ui/react-dropdown-menu": ^2.1.4
  "@radix-ui/react-menubar": ^1.1.4
  "@radix-ui/react-progress": ^1.1.1
  "@radix-ui/react-separator": ^1.1.1
  "@radix-ui/react-slot": ^1.1.1
  "@radix-ui/react-tabs": ^1.1.2
  "@radix-ui/react-tooltip": ^1.1.6
  "@shikijs/langs": ^1.24.0
  "@shikijs/themes": ^1.24.0
  "@shikijs/transformers": ^1.24.0
  "@storybook/addon-docs": 10.6.3
  "@storybook/addon-vitest": 10.6.3
  "@storybook/react": 10.6.3
  "@storybook/react-vite": 10.6.3
  "@medv/finder": ^4.0.2
  "@tailwindcss/cli": ^4.3.3
  "@tailwindcss/forms": ^0.5.9
  # Same version @tailwindcss/vite depends on; page-runtime's spikes compile with them directly.
  "@tailwindcss/node": ^4.3.3
  "@tailwindcss/oxide": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.66.8
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/react": ^16.1.0
  "@types/babel__core": ^7.20.5
  "@types/node": ^24
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": ^6.1.2
  ai: ^6.0.199
  ajv: ^8.18.0
  autoprefixer: ^10.4.20
  babel-preset-solid: ^1.9.12
  # Same version react-grab depends on, so both share one DevTools hook shape.
  bippy: 0.6.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cmdk: ^1.0.4
  country-flag-icons: ^1.6.20
  css.escape: ^1.5.1
  dom-accessibility-api: ^0.6.3
  dompurify: ^3.4.11
  es-module-lexer: ^3.0.0
  # page-runtime's tests run the IndexedDB storage against an in-memory implementation.
  fake-indexeddb: ^6.0.1
  jotai: ^2.20.1
  jsonc-parser: 3.3.1
  jsdom: ^26.0.0
  magic-string: ^1.4.5
  marked: ^15.0.0
  monaco-editor: 0.48.0
  monaco-yaml: 5.1.1
  modern-screenshot: ^4.7.0
  oxlint: ^1.60.0
  postcss: ^8.4.49
  prettier: ^3.8.3
  react: ^18.3.1
  react-dom: ^18.3.1
  react-grab: ^0.1.50
  rehype-raw: ^7.0.0
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.0
  remark-github-blockquote-alert: ^2.1.0
  # Same range Vite 8 depends on, so page-runtime's build tool shares Vite's rolldown.
  rolldown: ~1.2.14
  serve: ^14.2.6
  shiki: ^1.24.0
  solid-js: ^1.9.12
  sonner: ^1.7.1
  # page-runtime's service-worker compiler for TS, TSX and JSX.
  sucrase: ^3.35.1
  storybook: 10.6.3
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  ts-morph: ^28.0.0
  # Upstream react-grab packs with vite-plus (tsdown); the fork packs with tsdown directly.
  tsdown: ^0.23.5
  tsx: ^4.7.0
  typescript: ^5.7.2
  vite: ^8.3.5
  vite-plugin-dts: ^4.5.4
  vitest: ^5.0.5
  yaml: ^2.8.3
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@opentelemetry/api": ^1.9.1
  astro: ^7.4.4
  svgo: ^4.1.0
  "@astrojs/starlight": ^0.42.8
  lexical: 0.35.0
  '@lexical/react': 0.35.0

catalogMode: prefer

overrides:
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  brace-expansion: ^5.0.6
  fast-uri: ^3.1.2
  ws: ^8.21.0

# The global virtual store links each package in isolation, so undeclared
# imports no longer resolve through hoisting.
packageExtensions:
  # country-flag-icons/react/* imports react but declares no dependency on it.
  country-flag-icons:
    peerDependencies:
      react: "*"
    peerDependenciesMeta:
      react:
        optional: true

minimumReleaseAgeExclude:
  - "@flanksource/facet@0.1.74"

patchedDependencies:
  astro@7.4.4: patches/astro@7.4.4.patch
