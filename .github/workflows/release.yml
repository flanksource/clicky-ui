name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  # Auto-bump runs must not replace a pending source release in this group.
  group: release-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the auto-bump commit so the workflow doesn't loop on itself.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    strategy:
      # Keep package releases serial if the matrix grows: each job pushes its
      # own version bump to the protected main branch.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: "@flanksource/react-grab"
            directory: packages/react-grab
            manifest: package.json
            build_package: "@flanksource/react-grab"
            build_script: build
            publish_directory: packages/react-grab
            tag: react-grab
          - name: "@flanksource/page-runtime-build"
            directory: packages/page-runtime
            manifest: builder-package.json
            build_package: "@flanksource/page-runtime"
            build_script: build:builder
            publish_directory: packages/page-runtime/dist/build
            tag: page-runtime-build
          - name: "@flanksource/clicky-ui"
            directory: packages/ui
            manifest: package.json
            build_package: "@flanksource/clicky-ui"
            build_script: build
            publish_directory: packages/ui
            tag: clicky-ui
          - name: "@flanksource/page-runtime"
            directory: packages/page-runtime
            manifest: package.json
            build_package: "@flanksource/page-runtime"
            build_script: build
            publish_directory: packages/page-runtime
            tag: page-runtime
    steps:
      # Authenticate as a GitHub App so the bump commit/tag can be pushed to the
      # protected main branch. The App must be on the branch ruleset's bypass list
      # (the default GITHUB_TOKEN is subject to the ruleset and cannot bypass it).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLANKSOURCE_APP_ID }}
          private-key: ${{ secrets.FLANKSOURCE_APP_SECRET }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        # Derive the next version from the highest version already published on
        # npm, not from package.json/git — they can drift when a prior release
        # publishes but its bump commit never lands back on main.
        env:
          TAG_PREFIX: ${{ matrix.tag }}
          MANIFEST: ${{ github.workspace }}/${{ matrix.directory }}/${{ matrix.manifest }}
        run: pnpm --filter @flanksource/page-runtime exec tsx scripts/release-version.ts "$MANIFEST" "$TAG_PREFIX"

      - name: Build builder dependencies
        if: matrix.name == '@flanksource/page-runtime-build'
        run: pnpm --filter @flanksource/clicky-ui build

      - name: Build library
        if: matrix.name != '@flanksource/page-runtime'
        run: pnpm --filter ${{ matrix.build_package }} run ${{ matrix.build_script }}

      - name: Build complete runtime
        if: matrix.name == '@flanksource/page-runtime'
        run: |
          pnpm --filter @flanksource/clicky-ui build
          pnpm --filter @flanksource/react-grab build
          pnpm --filter @flanksource/page-runtime build

      - name: Verify runtime builder
        if: matrix.name == '@flanksource/page-runtime-build'
        run: |
          pnpm --filter @flanksource/page-runtime exec vitest run src/build scripts/release-version.test.ts scripts/release-version-cli.test.ts
          pnpm --filter @flanksource/clicky-ui exec vitest run scripts/release-config.test.ts

      - name: Publish to npm
        working-directory: ${{ matrix.publish_directory }}
        run: pnpm publish --access public --provenance --no-git-checks

      - name: Commit, tag, and push
        env:
          NAME: ${{ matrix.name }}
          MANIFEST: ${{ matrix.directory }}/${{ matrix.manifest }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git add "${MANIFEST}"
          git commit -m "chore(release): ${NAME}@${VERSION}"
          git tag "${TAG}"
          # Rebase before pushing: an earlier matrix entry may have landed its
          # own bump commit on main since this job checked out.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${NAME}@${VERSION}" \
            --generate-notes
