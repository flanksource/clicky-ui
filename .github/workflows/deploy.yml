name: Deploy Previews

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Install Vite+
        run: curl -fsSL https://vite.plus | bash
      - name: Add Vite+ to PATH
        run: echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - run: vp install

      - name: Build library
        run: pnpm --filter @flanksource/clicky-ui run build
      - name: Build Storybook
        run: pnpm --filter storybook exec storybook build --disable-telemetry --output-dir storybook-static
        env:
          STORYBOOK_BASE_PATH: /storybook/
      - name: Build documentation
        run: pnpm --filter docs run build:site
      - name: Build kitchen-sink
        run: pnpm --filter kitchen-sink exec vite build --base /kitchen-sink/

      - name: Assemble pages bundle
        run: |
          mkdir -p pages-bundle
          cp -r apps/docs/dist/. pages-bundle/
          cp -r apps/storybook/storybook-static pages-bundle/storybook
          cp -r apps/kitchen-sink/dist pages-bundle/kitchen-sink
          cp demo.html pages-bundle/demo.html
          echo "clicky-ui.flanksource.com" > pages-bundle/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-bundle
      - id: deployment
        uses: actions/deploy-pages@v4
