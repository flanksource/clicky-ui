name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # TEMP: debug — cold-cache storybook run with Vite's dependency log, to see
      # why Chat.stories/ChatWindows.stories fail to import only in CI. Remove.
      - name: Storybook cold-cache diagnostic
        run: |
          pnpm --filter @flanksource/clicky-ui run build > /dev/null
          cd apps/storybook
          set +e
          DEBUG='vite:deps' pnpm exec vitest run --reporter=dot > ../../storybook-diag.log 2>&1
          code=$?
          set -e
          grep -E -i "new dep|optimized dependencies changed|reload|outdated|scanner|Failed to|Error|Test Files|Tests  " ../../storybook-diag.log | grep -v "vite:deps Crawling" | cut -c1-300 | tail -n 80
          exit $code
      - name: Gavel tests
        uses: flanksource/gavel@fb4916508ea984a8d1cdcc52190765a0ed6ec57a # v0.0.61
        with:
          args: test --framework vitest --concurrency 1 --test-timeout 10m --timeout 15m
          comment-header: gavel-test
          artifact-name: gavel-test-results

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter @flanksource/clicky-ui run build
      - name: Gavel lint
        uses: flanksource/gavel@fb4916508ea984a8d1cdcc52190765a0ed6ec57a # v0.0.61
        with:
          args: lint
          comment-header: gavel-lint
          artifact-name: gavel-lint-results

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter @flanksource/clicky-ui run build
      - name: Verify expression exports
        run: pnpm --filter @flanksource/clicky-ui run check:expression-exports
      - name: Build Storybook
        run: pnpm --filter storybook exec storybook build --disable-telemetry
      - name: Build kitchen-sink
        run: pnpm --filter kitchen-sink exec vite build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/ui/dist
            apps/storybook/storybook-static
            apps/kitchen-sink/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gavel e2e tests
        uses: flanksource/gavel@fb4916508ea984a8d1cdcc52190765a0ed6ec57a # v0.0.61
        with:
          args: test --framework playwright --test-timeout 10m --timeout 15m
          comment-header: gavel-e2e
          artifact-name: gavel-e2e-results
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
