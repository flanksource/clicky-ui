name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gavel tests
        uses: flanksource/gavel@4c5015446610371c852fd866bfbe0efa77f24c9d # v0.0.80
        with:
          version: v0.0.80
          args: test --framework vitest --concurrency 1 --test-timeout 10m --timeout 15m
          comment-header: gavel-test
          artifact-name: gavel-test-results

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter @flanksource/clicky-ui run build
      - name: Gavel lint
        uses: flanksource/gavel@4c5015446610371c852fd866bfbe0efa77f24c9d # v0.0.80
        with:
          version: v0.0.80
          args: ${{ github.event_name == 'pull_request' && 'lint --changed' || 'lint' }}
          comment-header: gavel-lint
          artifact-name: gavel-lint-results

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter @flanksource/clicky-ui run build
      - name: Verify expression exports
        run: pnpm --filter @flanksource/clicky-ui run check:expression-exports
      - name: Build Storybook
        run: pnpm --filter storybook exec storybook build --disable-telemetry
      - name: Build kitchen-sink
        run: pnpm --filter kitchen-sink exec vite build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/ui/dist
            apps/storybook/storybook-static
            apps/kitchen-sink/dist
          retention-days: 7

  gavel:
    runs-on: ubuntu-latest
    needs: [test, lint, build, e2e]
    if: always()
    steps:
      - name: Require all CI jobs to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gavel e2e tests
        uses: flanksource/gavel@4c5015446610371c852fd866bfbe0efa77f24c9d # v0.0.80
        with:
          version: v0.0.80
          args: test --framework playwright --test-timeout 10m --timeout 15m
          comment-header: gavel-e2e
          artifact-name: gavel-e2e-results
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
